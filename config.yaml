# =============================================================================
# EDF preprocessing pipeline - settings
# =============================================================================
#
# Edit this file to change how the pipeline runs. You should never need to edit
# any .py file.
#
# Every setting below is optional. Delete a line (or this whole file) and the
# pipeline falls back to the same default shown here.
#
# Format notes:
#   - Indentation must use SPACES, never tabs.
#   - Always put a space after the colon:  key: value
#   - Use  ~  to mean "not set".
#
# Anything on the command line overrides this file, for example:
#   python process.py --input /path/to/my/edfs --output /path/to/results
# -----------------------------------------------------------------------------


# ---- Where your files are --------------------------------------------------

# Folder containing the .edf / .EDF files you want to process.
input_dir: ./input_data

# Folder where results are written. Created automatically if missing.
output_dir: ./output

# Folder containing the QRS detector weights (a .keras file).
# The weights are downloaded separately - see models/README.md.
model_dir: ./models

# Normally leave this unset: the pipeline finds the single .keras file in
# model_dir on its own. Set an explicit path only if you keep several models
# side by side and need to choose one.
model_path: ~


# ---- How much of your computer to use --------------------------------------

# Number of files to process at the same time.
# Leave unset to use all CPU cores except one, which keeps your machine usable
# while the pipeline runs. Set to 1 if you want to see errors clearly.
n_processes: ~

# Hours of recording loaded into memory at a time. Lower this if you run out
# of memory on very long recordings.
chunk_hours: 24


# ---- ECG quality control ---------------------------------------------------
#
# These decide which 10-second segments of ECG are trustworthy enough to use.
# The defaults are reasonable; change them only with a specific reason.

# Minimum fraction of a segment that must be covered by valid heartbeats.
rr_cover_min: 0.75

# Minimum number of detected beats before a segment is scored at all.
n_beats_min: 5

# Shortest and longest believable gap between heartbeats, in milliseconds.
# 250 ms is 240 bpm; 2500 ms is 24 bpm. Anything outside this is an artefact.
rr_min_ms: 250
rr_max_ms: 2500

# How many implausibly long gaps (a missed beat) a segment may contain.
max_rr_outliers: 1

# If less than this fraction of worn-time ECG passes quality control, the
# pipeline prints a warning and saves example failing traces so you can look
# at what went wrong.
qc_warn_below: 0.75


# ---- Physical activity intensity -------------------------------------------
#
# Cut-points in milli-g (mg) for Mean Amplitude Deviation, from
# Etzkorn et al. (2024): Zio XT chest-worn cut-points derived in 381 older
# adults in the ARIC study, mapped from waist-worn ActiGraph GT3X.
#
# IMPORTANT: these were validated in older adults (median age 78). If your
# participants are younger, these boundaries may not describe them well.
# Must be listed smallest to largest.

activity_very_light_mg: 9.04
activity_light_mg: 28.19
activity_moderate_mg: 58.08


# ---- Resting heart rate and HRV --------------------------------------------

# Movement below this (in mg) counts as being at rest.
sleep_threshold_mg: 9.04

# Clock window used to find overnight rest, as whole hours (0-23).
# The default 21:00-09:00 assumes a conventional sleep schedule.
#
# WARNING: this misclassifies anyone who sleeps outside these hours - shift
# workers, or someone who regularly sleeps 02:00-11:00. If that describes your
# participants, adjust the window here. Automatic per-participant detection of
# the main sleep period is planned.
night_start_hour: 21
night_end_hour: 9


# ---- Signal format ---------------------------------------------------------
#
# The bundled QRS detector was trained on 10-second segments of 250 Hz ECG.
# Changing these requires a model retrained to match, so leave them alone
# unless you know exactly what you are doing.

segment_seconds: 10
fs_expected: 250
