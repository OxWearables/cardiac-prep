# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: "ubuntu-22.04"
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

# The package itself is deliberately NOT installed here. Importing it would
# pull in TensorFlow, which is far too large for a docs build; conf.py puts
# src/ on sys.path and mocks the heavy dependencies instead.
python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
